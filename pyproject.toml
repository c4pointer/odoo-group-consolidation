# Tooling configuration only; the Odoo module is not a Python package distribution.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"__manifest__.py" = ["B018"]

[tool.ruff.lint.isort]
known-third-party = ["odoo"]
