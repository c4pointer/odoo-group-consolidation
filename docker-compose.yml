# Local runtime: Odoo 20 Community + PostgreSQL 17.
# The module under ./addons is mounted read-only; no custom image is built.
name: group-consolidation

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  odoo:
    image: odoo:20.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ODOO_PORT:-8020}:8069"
    volumes:
      - ./addons:/mnt/extra-addons:ro
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo

  # The empty database of `make bare`, on its own port so each URL opens one database.
  odoo-clean:
    image: odoo:20.0
    command: ["odoo", "--db-filter=^delta_clean$$"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ODOO_CLEAN_PORT:-8021}:8069"
    volumes:
      - ./addons:/mnt/extra-addons:ro
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo

volumes:
  pgdata:
  odoo-data:
