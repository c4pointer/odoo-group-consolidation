[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
; Odoo 20 binds to 127.0.0.1 by default; listen on all interfaces inside the container.
http_interface = 0.0.0.0
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; Local development only. Change before exposing the instance anywhere.
admin_passwd = admin
; Port 8020 serves the demo database only; the odoo-clean service (port 8021) overrides
; this filter for the empty database of `make bare`. Tests pass -d explicitly.
dbfilter = ^delta$
; No database manager or database list, so the instance can be shared through a tunnel.
list_db = False
; Trust the host and scheme forwarded by a tunnel; no effect without one.
proxy_mode = True
log_level = info
