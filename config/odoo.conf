[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
; Odoo 20 binds to 127.0.0.1 by default; listen on all interfaces inside the container.
http_interface = 0.0.0.0
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; Local development only. Change before exposing the instance anywhere.
admin_passwd = admin
; The web UI always opens the demo database; tests pass -d explicitly.
dbfilter = ^delta$
list_db = True
log_level = info
