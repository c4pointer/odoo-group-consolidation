# Compressing proxy in front of Odoo for public tunnels (`make tunnel`).
# Odoo serves its 7 MB script bundle uncompressed; free tunnels are slow or cut long
# transfers, so gzip here shrinks it to about a fifth. Port 8030 serves the demo
# database, port 8031 the empty one.
events {}

http {
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/xml image/svg+xml;

    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_read_timeout 720s;
    proxy_buffering on;

    # Requests reach the proxy from the tunnel client on the host, through the Docker gateway.
    # Take the visitor's address from the header the tunnel service adds, so Odoo's login
    # cooldown counts each visitor apart instead of all of them as the gateway.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Resolve the Odoo services when a request comes, so the proxy starts even if one is down.
    resolver 127.0.0.11 valid=10s;

    # Keep the scheme the tunnel forwarded (https), so Odoo builds https links behind it.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    server {
        listen 8030;
        location / {
            set $upstream odoo:8069;
            proxy_pass http://$upstream;
        }
    }

    server {
        listen 8031;
        location / {
            set $upstream odoo-clean:8069;
            proxy_pass http://$upstream;
        }
    }
}
